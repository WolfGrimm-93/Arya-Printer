name: Build & Release (arya_escpos_go)

# Compila el binario Windows del servicio (cross-compile desde ubuntu-latest --
# sin CGO/libusb en el modulo, ver arya_escpos_go/internal/hwadapter/usb.go y
# internal/winspool/winspool.go: acceden a las DLLs de Windows via
# golang.org/x/sys/windows, no via cgo, asi que no hace falta un runner
# Windows para compilar) y publica una GitHub Release versionada con el
# instalador adjunto. Arya-Market (repo privado, sibling) sincroniza desde
# ahi periodicamente hacia updates.aryamarket.app -- ver ese repo,
# .github/workflows/sync-arya-printer.yml.
#
# El repo tiene arya_escpos_go/ como subcarpeta (sibling de arya_escpos/, la
# version Python vieja), no como raiz -- todos los steps corren con
# working-directory: arya_escpos_go.

on:
  push:
    branches: [main]
    paths:
      - 'arya_escpos_go/**'

permissions:
  contents: write

defaults:
  run:
    working-directory: arya_escpos_go

env:
  # Todo el modulo es Windows-only a nivel de cmd/aryaprinter (importa
  # internal/hwadapter e internal/winspool, con build constraints "windows").
  # Sin esto, go vet/build en un runner Linux fallan con "build constraints
  # exclude all Go files" apenas tocan esos paquetes -- no es opcional.
  CGO_ENABLED: 0
  GOOS: windows
  GOARCH: amd64

jobs:
  release:
    name: Build, verificar y publicar release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: go vet ./... (cross, GOOS=windows)
        run: go vet ./...

      # go test queda fuera de este workflow a proposito: con GOOS=windows
      # cross-compila los binarios de test pero el runner Linux no puede
      # *ejecutarlos* (son PE de Windows). El gate real de tests sigue
      # siendo scripts/build.ps1 corrido local antes de cada commit (ver
      # comentario del propio script). go vet arriba es lo que sí puede
      # correr honestamente en este runner.

      - name: Fijar version de build (auto-incremental, nunca retrocede)
        id: version
        run: |
          set -e
          BASE=$(sed -n 's/.*serviceVersion = "\([0-9]*\.[0-9]*\).*/\1/p' internal/apiserver/root.go)
          VERSION="${BASE}.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version de build: $VERSION"

      - name: Cross-compile para Windows
        run: |
          set -e
          go build -ldflags "-X 'aryaescpos/internal/apiserver.serviceVersion=${{ steps.version.outputs.version }}'" -o aryaprinter.exe ./cmd/aryaprinter

      - name: Crear GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          gh release create "v${VERSION}" aryaprinter.exe \
            --title "v${VERSION}" \
            --notes "Build automático desde ${{ github.sha }}." \
            --latest
